<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Idade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="conteiner">
        <div id="classe">
            <img src="img/icone.webp" alt="icone persona">
            <h1>Classificacao Idade</h1>
        </div>
        <div id="dados">
            <p>Digite sua idade para saber em qual faixa etaria voce se encontra.</p>
            <label for="idade">Digite sua idade:</label>
            <input type="text" id="idade">
            <button id="btnClassificar">Classificar</button>
            <h6 id="resultado"></h6>
        </div>
        <div id="faixa">
            <h6>Faixa etaria: </h6>
            <p>0 a 5 anos - <span>Bebê</span></p>
            <p>6 a 11 anos - <span>Criança</span></p>
            <p>12 a 17 anos - <span>Adolescente</span></p>
            <p>18 a 59 anos - <span>Adulto</span></p>
            <p>60 anos ou mais - <span>Idoso</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
